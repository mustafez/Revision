<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1B2320" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Revision Tracker</title>
<style>
  :root {
    --bg:#1B2320; --surface:#232E29; --surface2:#2E3A34;
    --text:#E8E6DE; --text2:#9AA69C;
    --accent:#D4A24C; --accent-dim:#8C7038; --warn:#C1666B; --good:#7FA37A;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior-y:none; }
  .serif { font-family:Georgia,"Iowan Old Style","Times New Roman",serif; }
  #root { position:relative; display:flex; flex-direction:column; height:100vh; max-width:560px; margin:0 auto; background:var(--bg); }

  #authScreen { display:flex; flex-direction:column; justify-content:center; height:100%; padding:24px; }
  #authScreen h1 { font-size:26px; text-align:center; margin:0 0 6px; }
  #authScreen .sub { text-align:center; color:var(--text2); font-size:14px; margin-bottom:24px; }
  .input { width:100%; background:var(--surface2); border:none; border-radius:10px; padding:12px 14px; color:var(--text); font-size:15px; margin-bottom:12px; }
  .input:focus { outline:2px solid var(--accent); }
  textarea.input { resize:vertical; min-height:60px; font-family:inherit; }
  .btn { width:100%; background:var(--accent); color:#1B2320; font-weight:600; border:none; border-radius:10px; padding:13px 0; font-size:15px; cursor:pointer; margin-top:6px; }
  .btn-ghost { width:100%; background:transparent; color:var(--text2); border:none; padding:12px 0; font-size:13px; cursor:pointer; }
  .auth-error { font-size:13px; text-align:center; margin-top:8px; min-height:16px; color:var(--warn); }
  #googleBtn { background:var(--surface2); color:var(--text); margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:8px; }

  #appScreen { display:none; flex-direction:column; height:100%; }
  header { padding:16px 16px 10px; display:flex; align-items:center; gap:10px; flex-shrink:0; min-height:34px; }
  .back-btn { background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; padding:2px 6px 2px 0; }
  .hdr-title { font-size:18px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #logoutBtn { background:none; border:none; color:var(--text2); font-size:12px; cursor:pointer; padding:6px; }
  main { flex:1; overflow-y:auto; padding:2px 18px 96px; -webkit-overflow-scrolling:touch; }
  nav.tabs { display:flex; border-top:1px solid var(--surface2); background:var(--bg); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); flex-shrink:0; }
  .tab { flex:1; background:none; border:none; color:var(--text2); font-size:12px; padding:10px 0; cursor:pointer; border-radius:10px; }
  .tab.on { color:var(--accent); background:var(--surface); }
  .loading-msg { color:var(--text2); font-size:14px; text-align:center; padding:60px 20px; line-height:1.5; }
  .fab { position:absolute; right:20px; bottom:74px; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#1B2320; font-size:26px; border:none; box-shadow:0 4px 14px rgba(0,0,0,0.35); cursor:pointer; line-height:1; z-index:5; }

  .row { display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--surface2); cursor:pointer; }
  .row-main { flex:1; min-width:0; }
  .row-title { font-size:15px; color:var(--text); }
  .row-sub { font-size:12.5px; color:var(--text2); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .row-chevron { color:var(--text2); font-size:18px; flex-shrink:0; }
  .mini-track { height:4px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-top:7px; width:100%; }
  .mini-fill { height:100%; background:var(--accent); }
  .empty { text-align:center; color:var(--text2); font-size:14px; padding:50px 20px; line-height:1.6; }

  .badge-pill { font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; display:inline-block; }
  .badge-green { background:rgba(127,163,122,0.18); color:var(--good); }
  .badge-yellow { background:rgba(212,162,76,0.18); color:var(--accent); }
  .badge-red { background:rgba(193,102,107,0.2); color:var(--warn); }
  .badge-muted { background:var(--surface2); color:var(--text2); }
  .badge-accent { background:rgba(212,162,76,0.18); color:var(--accent); }
  .badge-good { background:rgba(127,163,122,0.18); color:var(--good); }

  .pane { padding-top:8px; }
  .subj-title-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .subj-title-row h2 { font-size:24px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon-btn { background:none; border:none; color:var(--text2); font-size:15px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
  .meta-line { font-size:13.5px; color:var(--text2); margin-bottom:16px; line-height:2; }
  .btn-outline-warn { border:1px solid var(--warn); color:var(--warn); background:transparent; border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; margin-bottom:20px; }
  .btn-outline-accent { border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; }

  .pill-tabs { display:flex; gap:8px; margin-bottom:18px; }
  .pill-tab { flex:1; padding:11px 0; border-radius:20px; border:1px solid var(--surface2); background:transparent; color:var(--text2); font-size:12.5px; cursor:pointer; text-align:center; }
  .pill-tab.on { background:var(--accent); color:#1B2320; border-color:var(--accent); font-weight:600; }

  .section-title { font-size:13px; color:var(--text2); margin:6px 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .add-btn-sm { color:#1B2320; background:var(--accent); border:none; font-size:12.5px; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; }

  .log-card { background:var(--surface); border-radius:12px; padding:13px 14px; margin-bottom:10px; }
  .log-card-top { display:flex; justify-content:space-between; align-items:baseline; }
  .log-pass { font-size:13.5px; font-weight:600; color:var(--text); }
  .log-date { font-size:12.5px; color:var(--text2); }
  .log-note { font-size:12.5px; color:var(--text2); font-style:italic; margin-top:6px; }
  .log-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .log-interval { font-size:11px; color:var(--accent); }
  .log-remove { font-size:11.5px; color:var(--warn); background:none; border:none; cursor:pointer; padding:2px 4px; }

  .hist-item { display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--surface2); font-size:13px; color:var(--text2); gap:10px; }
  .hist-item .del { color:var(--warn); background:none; border:none; font-size:11.5px; cursor:pointer; flex-shrink:0; }
  .btn-delete { color:var(--warn); background:none; border:none; font-size:13px; cursor:pointer; padding:12px 0; width:100%; text-align:center; margin-top:26px; }

  .metric-row { display:flex; gap:10px; margin-bottom:16px; }
  .metric-card { flex:1; background:var(--surface); border-radius:12px; padding:14px; text-align:center; }
  .metric-num { font-size:22px; font-weight:600; }
  .metric-label { font-size:11px; color:var(--text2); margin-top:2px; }

  .flag-item { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--surface2); }
  .flag-label { flex:1; font-size:13.5px; }
  .flag-label.mastered { color:var(--text2); text-decoration:line-through; }
  .flag-note { font-size:11.5px; color:var(--text2); margin-top:2px; }
  .flag-toggle { font-size:11.5px; padding:5px 10px; border-radius:8px; border:1px solid var(--surface2); background:transparent; color:var(--text2); cursor:pointer; flex-shrink:0; }
  .flag-toggle.on { border-color:var(--good); color:var(--good); }
  .flag-del { background:none; border:none; color:var(--text2); font-size:18px; cursor:pointer; padding:2px 6px; }

  .overlay { position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:20; }
  .overlay.show { display:flex; }
  .overlay-header { padding:16px 16px 8px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .overlay-back { background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px 8px; }
  .overlay-title { font-size:17px; font-weight:600; }
  .overlay-body { flex:1; overflow-y:auto; padding:8px 20px calc(30px + env(safe-area-inset-bottom,0px)); }
  .field-label { font-size:12.5px; color:var(--text2); margin:14px 0 6px; }
  .type-row { display:flex; gap:8px; }
  .chip { flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--surface2); background:transparent; color:var(--text2); font-size:13px; cursor:pointer; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  .sheet-actions { display:flex; gap:10px; margin-top:22px; }

  .stat-row { display:flex; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--surface2); font-size:14px; }
  .stat-row .n { color:var(--accent); font-weight:600; }
  .bars { display:flex; gap:8px; align-items:flex-end; height:100px; padding:0 4px 12px; }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; }
  .bar-track { flex:1; width:100%; display:flex; align-items:flex-end; background:var(--surface); border-radius:6px; overflow:hidden; }
  .bar-fill { width:100%; background:var(--accent); border-radius:6px 6px 0 0; }
  .bar-label { margin-top:6px; font-size:10.5px; color:var(--text2); }
</style>
</head>
<body>
<div id="root">

  <div id="authScreen">
    <h1 class="serif">Revision Tracker</h1>
    <div class="sub">Sign in to sync your subjects across devices</div>
    <button class="btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.5 4 24 4 16 4 9 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.9-5.3l-6.4-5.4C29.4 35 26.8 36 24 36c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9 39.4 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.4 5.4C40.9 36.4 44 30.7 44 24c0-1.4-.1-2.5-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div style="text-align:center; color:var(--text2); font-size:12px; margin-bottom:14px;">or use email</div>
    <input class="input" id="authEmail" type="email" placeholder="Email" autocomplete="email" />
    <input class="input" id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn" id="authSubmit">Log in</button>
    <button class="btn-ghost" id="authToggle">Don't have an account? Sign up</button>
    <button class="btn-ghost" id="forgotBtn">Forgot password?</button>
    <div class="auth-error" id="authError"></div>
  </div>

  <div id="appScreen">
    <header id="hdr"></header>
    <main id="main"></main>
    <button class="fab" id="fab" style="display:none;">+</button>
    <nav class="tabs">
      <button class="tab on" data-tab="due">Due Today</button>
      <button class="tab" data-tab="subjects">Subjects</button>
      <button class="tab" data-tab="books">Books</button>
      <button class="tab" data-tab="stats">Stats</button>
    </nav>

    <div class="overlay" id="sheetOverlay">
      <div class="overlay-header">
        <button class="overlay-back" id="sheetBack">‹</button>
        <div class="overlay-title" id="sheetTitle">Add</div>
      </div>
      <div class="overlay-body" id="sheetBody"></div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyBsSehFvU33Lq35WBw_H6QpEOFeYQOmoiM",
    authDomain: "my-library-2749c.firebaseapp.com",
    projectId: "my-library-2749c",
    storageBucket: "my-library-2749c.firebasestorage.app",
    messagingSenderId: "936698152438",
    appId: "1:936698152438:web:8a932dc91bd5897b11f3d7"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function addDaysStr(dateStr, n) {
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function daysBetween(a, b) {
    var da = new Date(a + "T00:00:00"), db_ = new Date(b + "T00:00:00");
    return Math.round((db_ - da) / 86400000);
  }
  function niceDate(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)) + Date.now().toString(36);
  }

  // Revision schedule: aim for ~3x/month early on (every 10 days), at minimum 2x/month.
  // The first three revisions are the important ones; after that, the gap can stretch to months.
  var REV_INTERVALS = [10, 10, 60]; // interval AFTER rev 1, rev 2, rev 3
  var BOOK_INTERVAL = 60;           // practice books: re-drill no sooner than ~2 months after finishing

  // ---------- state ----------
  var currentUser = null;
  var unsubSubjects = null;
  var unsubBooks = null;
  var subjects = [];
  var practiceBooks = [];      // GLOBAL, shared across every subject: [{id, title, mode, totalQuestions, createdAt}]
  var tab = "due";
  var stack = [{ type: "list" }];
  var subjectSubtab = "revision"; // revision | books | mocks
  var sheetMode = null;
  var sheetCtx = null;

  // ---------- auth ----------
  var isSignup = false;
  $("authToggle").addEventListener("click", function () {
    isSignup = !isSignup;
    $("authSubmit").textContent = isSignup ? "Sign up" : "Log in";
    $("authToggle").textContent = isSignup ? "Already have an account? Log in" : "Don't have an account? Sign up";
    $("authError").textContent = "";
  });
  $("googleBtn").addEventListener("click", function () {
    $("authError").textContent = "";
    auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(function (err) {
      $("authError").style.color = "var(--warn)";
      $("authError").textContent = friendlyAuthError(err);
    });
  });
  auth.getRedirectResult().catch(function (err) {
    if (err && err.code && err.code !== "auth/no-auth-event") {
      $("authError").style.color = "var(--warn)";
      $("authError").textContent = friendlyAuthError(err);
    }
  });
  $("authSubmit").addEventListener("click", function () {
    var email = $("authEmail").value.trim();
    var pass = $("authPassword").value;
    $("authError").textContent = "";
    if (!email || !pass) { $("authError").textContent = "Enter your email and password."; return; }
    var action = isSignup ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass);
    action.catch(function (err) {
      $("authError").style.color = "var(--warn)";
      $("authError").textContent = friendlyAuthError(err);
    });
  });
  $("forgotBtn").addEventListener("click", function () {
    var email = $("authEmail").value.trim();
    if (!email) { $("authError").textContent = "Type your email above first, then tap this again."; return; }
    auth.sendPasswordResetEmail(email).then(function () {
      $("authError").style.color = "var(--accent)";
      $("authError").textContent = "Reset link sent — check your email.";
    }).catch(function (err) {
      $("authError").style.color = "var(--warn)";
      $("authError").textContent = friendlyAuthError(err);
    });
  });
  function friendlyAuthError(err) {
    var code = err && err.code;
    if (code === "auth/email-already-in-use") return "That email already has an account — try logging in.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/invalid-email") return "That email address doesn't look right.";
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "Incorrect email or password.";
    if (code === "auth/user-not-found") return "No account found with that email.";
    return err && err.message ? err.message : "Something went wrong.";
  }

  auth.onAuthStateChanged(function (user) {
    currentUser = user;
    if (user) {
      $("authScreen").style.display = "none";
      $("appScreen").style.display = "flex";
      subscribeSubjects();
      subscribeBooks();
    } else {
      $("appScreen").style.display = "none";
      $("authScreen").style.display = "flex";
      if (unsubSubjects) { unsubSubjects(); unsubSubjects = null; }
      if (unsubBooks) { unsubBooks(); unsubBooks = null; }
      subjects = []; practiceBooks = [];
    }
  });
  $("logoutBtn") && $("logoutBtn").addEventListener("click", function () { auth.signOut(); });

  // ---------- data ----------
  function subjectsCol() { return db.collection("users").doc(currentUser.uid).collection("subjects"); }
  function booksCol() { return db.collection("users").doc(currentUser.uid).collection("practiceBooks"); }

  function subscribeSubjects() {
    if (unsubSubjects) unsubSubjects();
    $("main").innerHTML = '<div class="loading-msg">Loading your subjects…</div>';
    unsubSubjects = subjectsCol().onSnapshot(function (snap) {
      subjects = [];
      snap.forEach(function (doc) { subjects.push(Object.assign({ id: doc.id }, doc.data())); });
      render();
    }, function (err) {
      $("main").innerHTML = '<div class="loading-msg">Couldn\'t load: ' + escapeHtml(err.message) + '</div>';
    });
  }
  function subscribeBooks() {
    if (unsubBooks) unsubBooks();
    unsubBooks = booksCol().onSnapshot(function (snap) {
      practiceBooks = [];
      snap.forEach(function (doc) { practiceBooks.push(Object.assign({ id: doc.id }, doc.data())); });
      practiceBooks.sort(function (a, b) { return (a.createdAt||"").localeCompare(b.createdAt||""); });
      render();
    });
  }
  function saveSubject(subj) {
    var data = Object.assign({}, subj);
    delete data.id;
    subjectsCol().doc(subj.id).set(data, { merge: false }).catch(function (err) { alert("Couldn't save: " + err.message); });
  }
  function addSubject(name) {
    var id = uid();
    saveSubject({ id: id, name: name, createdAt: todayStr(), revisions: [], bookProgress: {}, mocks: [] });
  }
  function deleteSubject(id) { subjectsCol().doc(id).delete().catch(function (err) { alert("Couldn't delete: " + err.message); }); }
  function getSubject(id) { return subjects.filter(function (s) { return s.id === id; })[0]; }

  function addPracticeBook(title, mode, total) {
    var id = uid();
    booksCol().doc(id).set({ title: title, mode: mode, totalQuestions: total, createdAt: todayStr() + "T" + Date.now() })
      .catch(function (err) { alert("Couldn't add book: " + err.message); });
  }
  function deletePracticeBook(bookId) {
    booksCol().doc(bookId).delete().catch(function (err) { alert("Couldn't delete: " + err.message); });
  }
  function getGlobalBook(bookId) { return practiceBooks.filter(function (b) { return b.id === bookId; })[0]; }

  // per-subject progress against a shared/global book — every subject automatically has
  // an entry for every book that exists, defaulting to "not started" until touched
  function getProgress(subj, bookId) {
    var p = (subj.bookProgress || {})[bookId];
    return p || { completedQuestions: 0, passes: [], flagged: [], reviewLog: [] };
  }
  function updateProgress(subjectId, bookId, patch) {
    var s = getSubject(subjectId);
    var bp = Object.assign({}, s.bookProgress || {});
    bp[bookId] = Object.assign({}, getProgress(s, bookId), patch);
    saveSubject(Object.assign({}, s, { bookProgress: bp }));
  }

  // ---------- spaced repetition: subjects (theory) ----------
  function nextInterval(revCount) {
    if (revCount <= 0) return 0; // never revised yet -> due immediately
    if (revCount <= REV_INTERVALS.length) return REV_INTERVALS[revCount - 1];
    return REV_INTERVALS[REV_INTERVALS.length - 1] + (revCount - REV_INTERVALS.length) * 30;
  }
  function lastRevisedDate(subj) {
    if (!subj.revisions || subj.revisions.length === 0) return subj.createdAt;
    return subj.revisions.reduce(function (a, b) { return b.date > a ? b.date : a; }, subj.revisions[0].date);
  }
  function nextDueDate(subj) {
    var revCount = (subj.revisions || []).length;
    return addDaysStr(lastRevisedDate(subj), nextInterval(revCount));
  }
  function daysSinceTouch(subj) { return daysBetween(lastRevisedDate(subj), todayStr()); }
  function touchTier(days) { return days < 7 ? "green" : days <= 14 ? "yellow" : "red"; }
  function isDueToday(subj) { return nextDueDate(subj) <= todayStr(); }
  function badgePill(days) {
    var tier = touchTier(days);
    var label = days <= 0 ? "today" : days + "d ago";
    return '<span class="badge-pill badge-' + tier + '">' + label + '</span>';
  }

  function addRevision(subjectId, date, note) {
    var s = getSubject(subjectId);
    var revs = (s.revisions || []).slice();
    revs.push({ id: uid(), date: date, note: note || "" });
    revs.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    revs = revs.map(function (r, i) { return Object.assign({}, r, { revNumber: i + 1, intervalApplied: nextInterval(i + 1) }); });
    saveSubject(Object.assign({}, s, { revisions: revs }));
  }
  function removeRevision(subjectId, revId) {
    var s = getSubject(subjectId);
    var revs = s.revisions.filter(function (r) { return r.id !== revId; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })
      .map(function (r, i) { var rn = i + 1; return Object.assign({}, r, { revNumber: rn, intervalApplied: nextInterval(rn) }); });
    saveSubject(Object.assign({}, s, { revisions: revs }));
  }

  // ---------- spaced repetition: books (practice) ----------
  function isBookDone(progress, book) {
    if (!book) return false;
    if (book.mode === "single") return book.totalQuestions > 0 && (progress.completedQuestions || 0) >= book.totalQuestions;
    var passes = progress.passes || [];
    if (passes.length === 0) return false;
    return (passes[passes.length - 1].questionsCovered || 0) >= book.totalQuestions;
  }
  function bookLastPracticed(progress, book) {
    var dates = [];
    if (book.mode === "multi") (progress.passes || []).forEach(function (p) { dates.push(p.date); });
    else (progress.reviewLog || []).forEach(function (r) { dates.push(r.date); });
    if (dates.length === 0) return null;
    return dates.reduce(function (a, d) { return d > a ? d : a; }, dates[0]);
  }
  function bookNextDue(progress, book) {
    if (!isBookDone(progress, book)) return null; // only re-drill cycle applies once finished at least once
    var last = bookLastPracticed(progress, book);
    return last ? addDaysStr(last, BOOK_INTERVAL) : todayStr();
  }
  function bookIsDue(progress, book) { var due = bookNextDue(progress, book); return due !== null && due <= todayStr(); }

  // which book is "current" for a subject: first not-yet-finished book, in the order books were created
  function currentBookIndex(subj) {
    for (var i = 0; i < practiceBooks.length; i++) {
      if (!isBookDone(getProgress(subj, practiceBooks[i].id), practiceBooks[i])) return i;
    }
    return practiceBooks.length; // all done
  }

  // ---------- navigation ----------
  function push(view) { stack.push(view); history.pushState({ d: stack.length }, ""); render(); scrollTop(); }
  function popState() {
    if ($("sheetOverlay").classList.contains("show")) { closeSheet(); return; }
    if (stack.length > 1) { stack.pop(); render(); scrollTop(); }
  }
  function goBack() { history.back(); }
  window.addEventListener("popstate", popState);
  function scrollTop() { var m = $("main"); if (m) m.scrollTop = 0; }

  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      tab = btn.getAttribute("data-tab");
      if (tab !== "subjects") stack = [{ type: "list" }];
      document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b === btn); });
      render();
    });
  });

  $("fab").addEventListener("click", function () {
    if (tab === "books") openSheet("newBook", {});
    else openSheet("subject", {});
  });

        '<button class="chip" id="chipMulti" data-mode="multi">Multi-pass</button></div>';
      html += '<div class="sheet-actions"><button class="btn" id="sheetSave">Add book</button></div>';

    } else if (mode === "progress") {

      html += '<div style="font-size:12.5px;color:var(--text2);">This marks that you went back through this book for this subject — it resets its re-drill clock without changing your completion count.</div>';
      html += '<div class="sheet-actions"><button class="btn" id="sheetSave">Log review</button></div>';
    } else if (mode === "flag") {

      html += '<div class="field-label">Note (optional)</div><textarea class="input" id="fNote" placeholder="What went wrong?"></textarea>';
      html += '<div class="sheet-actions"><button class="btn" id="sheetSave">Add flag</button></div>';
    } else if (mode === "mock") {

      html += '<div class="field-label">Score obtained</div><input class="input" id="fScore" type="number" placeholder="Enter score"/>';
      html += '<div class="field-label">Total marks</div><input class="input" id="fTotalMarks" type="number" placeholder="Enter total marks"/>';
      html += '<div class="field-label">Questions attempted</div><input class="input" id="fAttempted" type="number" placeholder="Enter attempted count"/>';
      html += '<div class="field-label">Correct answers</div><input class="input" id="fCorrect" type="number" placeholder="Enter correct count"/>';
      html += '<div class="field-label">Negative mark per wrong answer (optional)</div><input class="input" id="fNeg" type="number" step="0.25" placeholder="e.g. 0.25"/>';

  function closeSheet() { $("sheetOverlay").classList.remove("show"); sheetMode = null; sheetCtx = null; }
  $("sheetBack").addEventListener("click", goBack);

  function submitSheet() {
    if (sheetMode === "subject") {
      var name = $("fName").value.trim();
      if (!name) return;
      addSubject(name);
      history.back();
    } else if (sheetMode === "renameSubject") {
      var s0 = getSubject(sheetCtx.subjectId);
      var newName = $("fName").value.trim();
      if (!newName) return;
      saveSubject(Object.assign({}, s0, { name: newName }));
      history.back();
    } else if (sheetMode === "revision") {
      var date = $("fDate").value || todayStr();
      var note = $("fNote").value.trim();
      addRevision(sheetCtx.subjectId, date, note);
      history.back();
    } else if (sheetMode === "newBook") {
      var title = $("fName").value.trim();
      var total = parseInt($("fTotal").value, 10) || 0;
      var mode = $("chipMulti").classList.contains("on") ? "multi" : "single";
      if (!title || !total) return;
      addPracticeBook(title, mode, total);
      history.back();
    } else if (sheetMode === "pass") {
      var pdate = $("fDate").value || todayStr();
      var count = parseInt($("fCount").value, 10) || 0;
      var s2 = getSubject(sheetCtx.subjectId);
      var prog2 = getProgress(s2, sheetCtx.bookId);
      var passes = (prog2.passes || []).slice();
      passes.push({ passNumber: passes.length + 1, date: pdate, questionsCovered: count });
      updateProgress(sheetCtx.subjectId, sheetCtx.bookId, { passes: passes });
      history.back();
    } else if (sheetMode === "progress") {
      var book3 = getGlobalBook(sheetCtx.bookId);
      var val = parseInt($("fCount").value, 10) || 0;
      updateProgress(sheetCtx.subjectId, sheetCtx.bookId, { completedQuestions: Math.min(val, book3.totalQuestions) });
      history.back();
    } else if (sheetMode === "reviewLog") {
      var rdate = $("fDate").value || todayStr();
      var s4 = getSubject(sheetCtx.subjectId);
      var prog4 = getProgress(s4, sheetCtx.bookId);
      var log = (prog4.reviewLog || []).slice();
      log.push({ date: rdate });
      updateProgress(sheetCtx.subjectId, sheetCtx.bookId, { reviewLog: log });
      history.back();
    } else if (sheetMode === "flag") {
      var label = $("fName").value.trim();
      if (!label) return;
      var note4 = $("fNote").value.trim();
      var s5 = getSubject(sheetCtx.subjectId);
      var prog5 = getProgress(s5, sheetCtx.bookId);
      var flagged = (prog5.flagged || []).slice();
      flagged.push({ id: uid(), label: label, note: note4, mastered: false });
      updateProgress(sheetCtx.subjectId, sheetCtx.bookId, { flagged: flagged });
      history.back();
    } else if (sheetMode === "mock") {
      var subj5 = getSubject(sheetCtx.subjectId);
      var mocks = (subj5.mocks || []).slice();
      mocks.push({
        id: uid(),
        date: $("fDate").value || todayStr(),
        scoreObtained: parseFloat($("fScore").value) || 0,
        totalMarks: parseFloat($("fTotalMarks").value) || 0,
        attempted: parseInt($("fAttempted").value, 10) || 0,
        correct: parseInt($("fCorrect").value, 10) || 0,
        negMarkPerWrong: parseFloat($("fNeg").value) || 0
      });
      saveSubject(Object.assign({}, subj5, { mocks: mocks }));
      history.back();
    }
  }

  function deleteMock(subjectId, mockId) {
    var s = getSubject(subjectId);
    saveSubject(Object.assign({}, s, { mocks: s.mocks.filter(function (m) { return m.id !== mockId; }) }));
  }

  // ---------- header ----------
  function renderHeader() {
    var top = stack[stack.length - 1];
    var title = "Revision Tracker", showBack = false;
    if (tab === "due") title = "Due Today";
    else if (tab === "stats") title = "Your Stats";
    else if (tab === "books" && top.type === "list") title = "Practice Books";
    else if (tab === "books" && top.type === "bookGlobalDetail") { var gb = getGlobalBook(top.bookId); title = gb ? gb.title : "Book"; showBack = true; }
    else if (top.type === "list") title = "Subjects";
    else if (top.type === "detail") { var s = getSubject(top.subjectId); title = s ? s.name : "Subject"; showBack = true; }
    else if (top.type === "bookDetail") { var b = getGlobalBook(top.bookId); title = b ? b.title : "Book"; showBack = true; }
    var html = "";
    if (showBack) html += '<button class="back-btn" id="backBtn">‹</button>';
    html += '<span class="hdr-title serif">' + escapeHtml(title) + '</span>';
    html += '<button id="logoutBtn">Log out</button>';
    $("hdr").innerHTML = html;
    var backBtn = $("backBtn");
    if (backBtn) backBtn.addEventListener("click", goBack);
    $("logoutBtn").addEventListener("click", function () { auth.signOut(); });
    $("fab").style.display = ((tab === "subjects" && top.type === "list") || (tab === "books" && top.type === "list")) ? "flex" : "none";
  }

  // ---------- Due Today ----------
  function renderDue() {
    var dueSubjects = subjects.filter(isDueToday).sort(function (a, b) { return daysSinceTouch(b) - daysSinceTouch(a); });
    var dueBooks = [];
    subjects.forEach(function (s) {
      practiceBooks.forEach(function (b) {
        var prog = getProgress(s, b.id);
        if (bookIsDue(prog, b)) dueBooks.push({ subject: s, book: b, progress: prog });
      });
    });

    var html = '<div class="pane">';
    if (subjects.length === 0) {
      html += '<div class="empty">No subjects yet. Add one from the Subjects tab.</div>';
    } else {
      html += '<div class="section-title">Subjects due for revision</div>';
      if (dueSubjects.length === 0) {
        html += '<div class="empty" style="padding:20px;">Nothing due — you\'re caught up. 🎉</div>';
      } else {
        dueSubjects.forEach(function (s) {
          var days = daysSinceTouch(s);
          var overdue = daysBetween(nextDueDate(s), todayStr());
          var curIdx = currentBookIndex(s);
          var curBook = practiceBooks[curIdx];
          html += '<div class="row" data-open="' + s.id + '">' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(s.name) + '</div>' +
            '<div class="row-sub">' + badgePill(days) + '<span>Rev ' + ((s.revisions||[]).length) + '</span>' +
            (curBook ? '<span>· practicing: ' + escapeHtml(curBook.title) + '</span>' : '') + '</div></div>' +
            '<span class="badge-pill badge-red">' + (overdue > 0 ? overdue + "d overdue" : "due") + '</span>' +
          '</div>';
        });
      }
      html += '<div class="section-title" style="margin-top:24px;">Books due for practice</div>';
      if (dueBooks.length === 0) {
        html += '<div class="empty" style="padding:20px;">No books due for a re-pass yet.</div>';
      } else {
        dueBooks.forEach(function (x) {
          var due = bookNextDue(x.progress, x.book);
          var overdue = daysBetween(due, todayStr());
          html += '<div class="row" data-open="' + x.subject.id + '" data-open-book="' + x.book.id + '">' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(x.book.title) + '</div>' +
            '<div class="row-sub">' + escapeHtml(x.subject.name) + '</div></div>' +
            '<span class="badge-pill badge-red">' + (overdue > 0 ? overdue + "d overdue" : "due") + '</span>' +
          '</div>';
        });
      }
    }
    html += '</div>';
    return html;
  }

  function renderList() {
    var sorted = subjects.slice().sort(function (a,b) { return daysSinceTouch(b) - daysSinceTouch(a); });
    var html = '<div class="pane">';

      html += '<div class="empty">No subjects yet. Tap + to add your first one.</div>';

          '<span class="row-chevron">›</span>' +
        '</div>';

  // ---------- Subject detail ----------
  function renderDetail(subjectId) {
    var s = getSubject(subjectId);
    if (!s) return '<div class="empty">Subject not found.</div>';
    var days = daysSinceTouch(s);
    var revCount = (s.revisions || []).length;
    var due = nextDueDate(s);

    var html = '<div class="pane">';
    html += '<div class="subj-title-row"><h2 class="serif">' + escapeHtml(s.name) + '</h2>' +
      '<button class="icon-btn" id="renameBtn">✎</button></div>';
    html += '<div class="meta-line">' + revCount + ' revision' + (revCount===1?"":"s") + ' logged · Last touched: ' + badgePill(days) + '<br/>Next due ' + niceDate(due) + '</div>';
    html += '<button class="btn-outline-warn" id="deleteSubjBtn">Delete subject</button>';

    html += '<div class="pill-tabs">' +
      '<button class="pill-tab' + (subjectSubtab==="revision"?" on":"") + '" data-subtab="revision">Revision</button>' +
      '<button class="pill-tab' + (subjectSubtab==="books"?" on":"") + '" data-subtab="books">Question Books</button>' +
      '<button class="pill-tab' + (subjectSubtab==="mocks"?" on":"") + '" data-subtab="mocks">Mock Tests</button>' +
    '</div>';

    if (subjectSubtab === "revision") {
      html += '<div class="section-title">Revision log<button class="add-btn-sm" id="addRevBtn">+ Log revision</button></div>';
      if (revCount === 0) {
        html += '<div class="empty" style="padding:20px;">No revisions logged yet. Already covered this subject before? Log a past date to backfill your history.</div>';
      } else {
        s.revisions.slice().sort(function(a,b){return b.date<a.date?-1:1;}).forEach(function (r) {
          html += '<div class="log-card">' +
            '<div class="log-card-top"><span class="log-pass">Pass #' + r.revNumber + '</span><span class="log-date">' + niceDate(r.date) + '</span></div>' +
            (r.note ? '<div class="log-note">' + escapeHtml(r.note) + '</div>' : '') +
            '<div class="log-bottom"><span class="log-interval">Next interval: +' + r.intervalApplied + 'd</span>' +
            '<button class="log-remove" data-del-rev="' + r.id + '">Remove</button></div>' +
          '</div>';
        });
      }
    } else if (subjectSubtab === "books") {
      var curIdx = currentBookIndex(s);
      html += '<div class="section-title">Question books<span style="font-size:11.5px;color:var(--text2);font-weight:400;">Manage the book list from the Books tab</span></div>';
      if (practiceBooks.length === 0) {
        html += '<div class="empty" style="padding:20px;">No practice books exist yet. Add one from the Books tab — it\'ll automatically apply here too.</div>';
      } else {
        practiceBooks.forEach(function (b, i) {
          var prog = getProgress(s, b.id);
          var done = isBookDone(prog, b);
          var pct, sub;
          if (b.mode === "single") {
            pct = b.totalQuestions ? Math.round((prog.completedQuestions||0)/b.totalQuestions*100) : 0;
            sub = (prog.completedQuestions||0) + " / " + b.totalQuestions + " questions";
          } else {
            var passes = prog.passes || [];
            var lastPass = passes[passes.length-1];
            pct = lastPass ? Math.round((lastPass.questionsCovered||0)/b.totalQuestions*100) : 0;
            sub = passes.length + " pass" + (passes.length===1?"":"es");
          }
          var statusBadge = done
            ? (bookIsDue(prog, b) ? '<span class="badge-pill badge-red">due for re-practice</span>' : '<span class="badge-pill badge-good">completed</span>')
            : (i === curIdx ? '<span class="badge-pill badge-accent">practicing now</span>' : '<span class="badge-pill badge-muted">not started yet</span>');
          html += '<div class="row" data-open-book="' + b.id + '">' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(b.title) + '</div>' +
            '<div class="row-sub">' + statusBadge + '<span>' + sub + '</span></div>' +
            '<div class="mini-track"><div class="mini-fill" style="width:' + pct + '%"></div></div></div>' +
            '<span class="row-chevron">›</span>' +
          '</div>';
        });
      }
    } else if (subjectSubtab === "mocks") {
      html += '<div class="section-title">Mock tests<button class="add-btn-sm" id="addMockBtn">+ Add mock</button></div>';
      var mocks = s.mocks || [];
      if (mocks.length === 0) {
        html += '<div class="empty" style="padding:20px;">No mocks logged yet.</div>';
      } else {
        var avgAcc = Math.round(mocks.reduce(function(a,m){return a+(m.attempted?m.correct/m.attempted*100:0);},0)/mocks.length);
        html += '<div class="row-sub" style="margin-bottom:12px;">Average accuracy: ' + avgAcc + '% across ' + mocks.length + ' mocks</div>';
        mocks.slice().sort(function(a,b){return b.date<a.date?-1:1;}).forEach(function (m) {
          var acc = m.attempted ? Math.round(m.correct/m.attempted*100) : 0;
          var penalty = m.negMarkPerWrong ? ((m.attempted-m.correct)*m.negMarkPerWrong).toFixed(2) : null;
          html += '<div class="hist-item"><span>' + niceDate(m.date) + ' — ' + m.scoreObtained + '/' + m.totalMarks + '</span>' +
            '<span>' + acc + '% acc' + (penalty ? " · -" + penalty : "") + '</span>' +
            '<button class="del" data-del-mock="' + m.id + '">×</button></div>';
        });
      }
    }
    html += '</div>';
    return html;
  }

  // ---------- Book detail (per subject) ----------
  function renderBookDetail(subjectId, bookId) {
    var s = getSubject(subjectId);
    var b = getGlobalBook(bookId);
    if (!b || !s) return '<div class="empty">Book not found.</div>';
    var prog = getProgress(s, bookId);
    var done = isBookDone(prog, b);
    var last = bookLastPracticed(prog, b);
    var due = bookNextDue(prog, b);
    var html = '<div class="pane">';
    html += '<div class="row-sub" style="margin-bottom:14px;">For subject: <strong style="color:var(--text);">' + escapeHtml(s.name) + '</strong></div>';

    if (b.mode === "single") {
      var pct = b.totalQuestions ? Math.round((prog.completedQuestions||0)/b.totalQuestions*100) : 0;
      html += '<div class="metric-row"><div class="metric-card"><div class="metric-num">' + pct + '%</div><div class="metric-label">complete</div></div>' +
        '<div class="metric-card"><div class="metric-num">' + (prog.completedQuestions||0) + '/' + b.totalQuestions + '</div><div class="metric-label">questions</div></div></div>';
      html += '<button class="btn" id="updateProgressBtn">Update progress</button>';
      html += '<div class="meta-line" style="margin-top:14px;">' + (done ? (last ? "Last reviewed " + niceDate(last) + " · Next review " + niceDate(due) : "Marked complete — log a review pass to start its re-drill clock") : "Not finished yet for this subject") + '</div>';
      if (done) html += '<button class="btn-outline-accent" id="reviewLogBtn">Log a review pass today</button>';
    } else {
      html += '<div class="meta-line">' + (done ? "Last practiced " + niceDate(last) + " · Next due " + niceDate(due) : "Not finished yet for this subject") + '</div>';
      html += '<div class="section-title">Passes<button class="add-btn-sm" id="addPassBtn">+ Log pass</button></div>';
      var passes = prog.passes || [];
      if (passes.length === 0) html += '<div class="empty" style="padding:20px;">No passes logged yet.</div>';
      else passes.slice().sort(function(a,b2){return b2.date<a.date?-1:1;}).forEach(function (p) {
        html += '<div class="hist-item"><span>Pass ' + p.passNumber + '</span><span>' + p.questionsCovered + ' / ' + b.totalQuestions + ' Qs · ' + niceDate(p.date) + '</span></div>';
      });
    }
    html += '<div class="section-title" style="margin-top:22px;">Flagged questions<button class="add-btn-sm" id="addFlagBtn">+ Add flag</button></div>';
    var flagged = prog.flagged || [];
    if (flagged.length === 0) {
      html += '<div class="empty" style="padding:20px;">Nothing flagged. Add questions you got wrong here to re-drill them without redoing the whole book.</div>';
    } else {
      flagged.forEach(function (f) {
        html += '<div class="flag-item">' +
          '<div style="flex:1;"><div class="flag-label' + (f.mastered?" mastered":"") + '">' + escapeHtml(f.label) + '</div>' +
          (f.note ? '<div class="flag-note">' + escapeHtml(f.note) + '</div>' : '') + '</div>' +
          '<button class="flag-toggle' + (f.mastered?" on":"") + '" data-toggle-flag="' + f.id + '">' + (f.mastered ? "Mastered" : "Mark mastered") + '</button>' +
          '<button class="flag-del" data-del-flag="' + f.id + '">×</button>' +
        '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function toggleFlag(subjectId, bookId, flagId) {
    var s = getSubject(subjectId);
    var prog = getProgress(s, bookId);
    var flagged = (prog.flagged || []).map(function (f) { return f.id === flagId ? Object.assign({}, f, { mastered: !f.mastered }) : f; });
    updateProgress(subjectId, bookId, { flagged: flagged });
  }
  function deleteFlag(subjectId, bookId, flagId) {
    var s = getSubject(subjectId);
    var prog = getProgress(s, bookId);
    updateProgress(subjectId, bookId, { flagged: (prog.flagged || []).filter(function (f) { return f.id !== flagId; }) });
  }

  // ---------- Books tab (global list) ----------
  function renderBooksList() {
    var html = '<div class="pane">';
    if (practiceBooks.length === 0) {
      html += '<div class="empty">No practice books yet. Tap + to add one — it\'ll automatically apply to every subject.</div>';
    } else {
      practiceBooks.forEach(function (b) {
        var doneCount = subjects.filter(function (s) { return isBookDone(getProgress(s, b.id), b); }).length;
        html += '<div class="row" data-open-global-book="' + b.id + '">' +
          '<div class="row-main"><div class="row-title">' + escapeHtml(b.title) + '</div>' +
          '<div class="row-sub"><span>' + (b.mode==="single"?"Single-pass":"Multi-pass") + ' · ' + b.totalQuestions + ' questions</span>' +
          '<span>· ' + doneCount + '/' + subjects.length + ' subjects completed</span></div></div>' +
          '<span class="row-chevron">›</span>' +
        '</div>';
      });
    }
    html += '</div>';
    return html;
  }
  function renderGlobalBookDetail(bookId) {
    var b = getGlobalBook(bookId);
    if (!b) return '<div class="empty">Book not found.</div>';
    var html = '<div class="pane">';
    html += '<div class="meta-line">' + (b.mode==="single"?"Single-pass":"Multi-pass") + ' · ' + b.totalQuestions + ' total questions</div>';
    html += '<div class="section-title">Progress by subject</div>';
    if (subjects.length === 0) {
      html += '<div class="empty" style="padding:20px;">No subjects yet.</div>';
    } else {
      subjects.forEach(function (s) {
        var prog = getProgress(s, b.id);
        var done = isBookDone(prog, b);
        var badge = done
          ? (bookIsDue(prog, b) ? '<span class="badge-pill badge-red">due for re-practice</span>' : '<span class="badge-pill badge-good">completed</span>')
          : '<span class="badge-pill badge-muted">' + (b.mode==="single" ? (prog.completedQuestions||0) + "/" + b.totalQuestions : (prog.passes||[]).length + " passes") + '</span>';
        html += '<div class="hist-item"><span>' + escapeHtml(s.name) + '</span>' + badge + '</div>';
      });
    }
    html += '<button class="btn-delete" id="deleteGlobalBookBtn">Delete this book (removes it for all subjects)</button>';
    html += '</div>';
    return html;
  }

  // ---------- stats ----------
  function renderStats() {
    var total = subjects.length;
    var dueCount = subjects.filter(isDueToday).length;
    var totalRevs = subjects.reduce(function (a,s) { return a + (s.revisions||[]).length; }, 0);
    var allMocks = [];
    subjects.forEach(function (s) { (s.mocks||[]).forEach(function (m) { allMocks.push(Object.assign({ subject: s.name }, m)); }); });
    var avgAcc = allMocks.length ? Math.round(allMocks.reduce(function(a,m){return a+(m.attempted?m.correct/m.attempted*100:0);},0)/allMocks.length) : null;

    var html = '<div class="pane">';
    html += '<div class="stat-row"><span>Total subjects</span><span class="n">' + total + '</span></div>';
    html += '<div class="stat-row"><span>Due today</span><span class="n">' + dueCount + '</span></div>';
    html += '<div class="stat-row"><span>Total revisions logged</span><span class="n">' + totalRevs + '</span></div>';
    html += '<div class="stat-row"><span>Total practice books</span><span class="n">' + practiceBooks.length + '</span></div>';
    html += '<div class="stat-row"><span>Average mock accuracy</span><span class="n">' + (avgAcc===null?"–":avgAcc+"%") + '</span></div>';

    html += '<div class="section-title">Days since touch, by subject</div>';
    subjects.slice().sort(function(a,b){return daysSinceTouch(b)-daysSinceTouch(a);}).forEach(function (s) {
      var days = daysSinceTouch(s);
      html += '<div class="stat-row"><span>' + escapeHtml(s.name) + '</span>' + badgePill(days) + '</div>';
    });

    if (allMocks.length > 0) {
      html += '<div class="section-title">Recent mock trend</div>';
      var recent = allMocks.slice().sort(function(a,b){return a.date<b.date?-1:1;}).slice(-8);
      html += '<div class="bars">';
      recent.forEach(function (m) {
        var acc = m.attempted ? Math.round(m.correct/m.attempted*100) : 0;
        html += '<div class="bar-col"><div class="bar-track"><div class="bar-fill" style="height:' + acc + '%"></div></div><div class="bar-label">' + m.date.slice(5) + '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  // ---------- master render ----------
  function render() {
    renderHeader();
    var main = $("main");
    var top = stack[stack.length - 1];

    if (tab === "due") { main.innerHTML = renderDue(); wireDueOpen(); return; }
    if (tab === "stats") { main.innerHTML = renderStats(); return; }

    if (tab === "books") {
      if (top.type === "bookGlobalDetail") {
        main.innerHTML = renderGlobalBookDetail(top.bookId);
        var delGB = $("deleteGlobalBookBtn");
        if (delGB) delGB.addEventListener("click", function () {
          if (confirm("Delete this book for every subject? This can't be undone.")) { deletePracticeBook(top.bookId); goBack(); }
        });
      } else {
        main.innerHTML = renderBooksList();
        document.querySelectorAll("[data-open-global-book]").forEach(function (el) {
          el.addEventListener("click", function () { push({ type: "bookGlobalDetail", bookId: el.getAttribute("data-open-global-book") }); });
        });
      }
      return;
    }

    if (top.type === "list") {
      main.innerHTML = renderList();
      document.querySelectorAll("[data-open]").forEach(function (el) {
        el.addEventListener("click", function () { push({ type: "detail", subjectId: el.getAttribute("data-open") }); });
      });
    } else if (top.type === "detail") {
      main.innerHTML = renderDetail(top.subjectId);
      var renameBtn = $("renameBtn");
      if (renameBtn) renameBtn.addEventListener("click", function () { openSheet("renameSubject", { subjectId: top.subjectId }); });
      var delBtn = $("deleteSubjBtn");
      if (delBtn) delBtn.addEventListener("click", function () {
        if (confirm("Delete this subject and all its data? This can't be undone.")) { deleteSubject(top.subjectId); goBack(); }
      });
      document.querySelectorAll("[data-subtab]").forEach(function (el) {
        el.addEventListener("click", function () { subjectSubtab = el.getAttribute("data-subtab"); render(); });
      });
      var addRevBtn = $("addRevBtn");
      if (addRevBtn) addRevBtn.addEventListener("click", function () { openSheet("revision", { subjectId: top.subjectId }); });
      document.querySelectorAll("[data-del-rev]").forEach(function (el) {
        el.addEventListener("click", function () {
          if (confirm("Remove this revision entry?")) removeRevision(top.subjectId, el.getAttribute("data-del-rev"));
        });
      });
      var addMockBtn = $("addMockBtn");
      if (addMockBtn) addMockBtn.addEventListener("click", function () { openSheet("mock", { subjectId: top.subjectId }); });
      document.querySelectorAll("[data-del-mock]").forEach(function (el) {
        el.addEventListener("click", function () {
          if (confirm("Delete this mock result?")) deleteMock(top.subjectId, el.getAttribute("data-del-mock"));
        });
      });
      document.querySelectorAll("[data-open-book]").forEach(function (el) {
        el.addEventListener("click", function () { push({ type: "bookDetail", subjectId: top.subjectId, bookId: el.getAttribute("data-open-book") }); });
      });
    } else if (top.type === "bookDetail") {
      main.innerHTML = renderBookDetail(top.subjectId, top.bookId);
      var upBtn = $("updateProgressBtn");
      if (upBtn) upBtn.addEventListener("click", function () { openSheet("progress", { subjectId: top.subjectId, bookId: top.bookId }); });
      var revLogBtn = $("reviewLogBtn");
      if (revLogBtn) revLogBtn.addEventListener("click", function () { openSheet("reviewLog", { subjectId: top.subjectId, bookId: top.bookId }); });
      var addPassBtn = $("addPassBtn");
      if (addPassBtn) addPassBtn.addEventListener("click", function () { openSheet("pass", { subjectId: top.subjectId, bookId: top.bookId }); });
      var addFlagBtn = $("addFlagBtn");
      if (addFlagBtn) addFlagBtn.addEventListener("click", function () { openSheet("flag", { subjectId: top.subjectId, bookId: top.bookId }); });
      document.querySelectorAll("[data-toggle-flag]").forEach(function (el) {
        el.addEventListener("click", function () { toggleFlag(top.subjectId, top.bookId, el.getAttribute("data-toggle-flag")); });
      });
      document.querySelectorAll("[data-del-flag]").forEach(function (el) {
        el.addEventListener("click", function () { deleteFlag(top.subjectId, top.bookId, el.getAttribute("data-del-flag")); });
      });
    }
  }

  function wireDueOpen() {
    document.querySelectorAll("[data-open]").forEach(function (el) {
      el.addEventListener("click", function () {
        tab = "subjects";
        document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on", b.getAttribute("data-tab")==="subjects");});
        var bookId = el.getAttribute("data-open-book");
        stack = bookId ? [{ type: "list" }, { type: "detail", subjectId: el.getAttribute("data-open") }, { type: "bookDetail", subjectId: el.getAttribute("data-open"), bookId: bookId }]
                       : [{ type: "list" }, { type: "detail", subjectId: el.getAttribute("data-open") }];
        render();
      });
    });
  }

})();
</script>
</body>
</html>
